services:
  - type: web
    name: render-postgresql-migrate-deploy-demo
    env: node
    # TASK: this build command generates the Prisma Client but never applies
    # migrations. Add "&& npx prisma migrate deploy" so a fresh deploy creates
    # the tables described by prisma/schema.prisma before the app starts.
    buildCommand: npm ci && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # TASK: add a DIRECT_URL entry here once you provision Render PostgreSQL,
      # pointing at the same database's non-pooled connection string.
