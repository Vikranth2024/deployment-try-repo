name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --if-present

  # TASK: add a deploy job here.
  # It must:
  #   - only run after the ci job passes (needs: ci)
  #   - only run on pushes to main (if: github.ref == 'refs/heads/main')
  #   - send an HTTP POST to the Render deploy hook stored in secrets:
  #     curl --fail-with-body --show-error \
  #       -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
  #   - use runs-on: ubuntu-24.04
